name: STORM CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verify Dependencies (Gateway)
        run: |
          cd services/gateway
          go mod download
          go mod verify

      - name: Run Tests (Gateway)
        run: |
          cd services/gateway
          go test -v -cover ./...

      - name: Verify Dependencies (Messages)
        run: |
          cd services/messages
          go mod download
          go mod verify

      - name: Run Gosec Security Scan (Gateway)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd services/gateway
          gosec ./...

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Wait for SonarQube
        shell: bash
        run: |
          for i in {1..90}; do
            status="$(curl -fsS http://localhost:9000/api/system/status | jq -r '.status' 2>/dev/null || true)"
            if [ "$status" = "UP" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "SonarQube did not become ready on http://localhost:9000" >&2
          exit 1

      - name: Create SonarQube token
        id: sonar_token
        shell: bash
        run: |
          token_json="$(curl -fsS -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github-ci")"
          token="$(echo "$token_json" | jq -r '.token')"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to generate SonarQube token" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Generate Go coverage reports
        shell: bash
        run: |
          mkdir -p .sonar
          go test ./services/gateway/... -coverprofile .sonar/coverage-gateway.out
          go test ./services/messages/... -coverprofile .sonar/coverage-messages.out

      - name: Run Sonar Scanner
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ steps.sonar_token.outputs.token }}
        run: |
          docker run --rm \
            --network host \
            -e SONAR_HOST_URL \
            -e SONAR_TOKEN \
            -v "${{ github.workspace }}:/usr/src" \
            sonarsource/sonar-scanner-cli

      - name: Change default admin password
        if: always()
        shell: bash
        run: |
          curl -fsS -u admin:admin -X POST \
            "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=${GITHUB_RUN_ID}-done" >/dev/null || true

  docker:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Gateway Image
        run: |
          docker build -t storm-gateway:test -f services/gateway/Dockerfile services/gateway

      - name: Scan Gateway Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'storm-gateway:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Build Messages Image
        run: |
          docker build -t storm-messages:test -f services/messages/Dockerfile services/messages

      - name: Scan Messages Image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'storm-messages:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'
