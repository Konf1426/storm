sonar.projectName=storm
sonar.sourceEncoding=UTF-8

sonar.sources=services,frontend/src
sonar.tests=services
sonar.test.inclusions=services/**/*_test.go

sonar.go.coverage.reportPaths=out/sonar/gateway.coverage.out,out/sonar/messages.coverage.out

sonar.exclusions=**/node_modules/**,**/.vite/**,**/dist/**,**/out/**,**/plans/**,**/docs/**,**/*_test.go
sonar.coverage.exclusions=frontend/**,infra/**,docs/**,plans/**
