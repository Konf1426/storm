sonar.projectKey=storm
sonar.projectName=STORM
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.sources=services,frontend/src,scripts
sonar.tests=services
sonar.test.inclusions=**/*_test.go

sonar.exclusions=**/node_modules/**,**/dist/**,docs/**,infra/**,plans/**,**/*.md,**/*.png,**/*.pdf
sonar.go.coverage.reportPaths=.sonar/coverage-gateway.out,.sonar/coverage-messages.out
