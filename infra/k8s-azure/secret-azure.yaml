# Secrets for Azure managed services.
# REPLACE placeholder values with actual Terraform outputs before applying.
apiVersion: v1
kind: Secret
metadata:
  name: storm-secret
  namespace: storm
type: Opaque
stringData:
  # terraform output -raw postgres_dsn
  POSTGRES_DSN: "postgres://storm:REPLACE_PASSWORD@REPLACE_PG_FQDN:5432/storm?sslmode=require"
  # terraform output -raw redis_connection_string
  REDIS_ADDR: "REPLACE_REDIS_HOSTNAME:6380"
  # terraform output -raw jwt_secret
  JWT_SECRET: "REPLACE_JWT_SECRET"
  # terraform output -raw jwt_refresh_secret
  JWT_REFRESH_SECRET: "REPLACE_JWT_REFRESH_SECRET"
