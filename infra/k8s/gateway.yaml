apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: storm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: storm-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: stormacrawgffq.azurecr.io/storm-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 6060
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: storm-config
                  key: NATS_URL
            - name: GATEWAY_ADDR
              valueFrom:
                configMapKeyRef:
                  name: storm-config
                  key: GATEWAY_ADDR
            - name: PPROF_ADDR
              valueFrom:
                configMapKeyRef:
                  name: storm-config
                  key: PPROF_ADDR_GATEWAY
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: storm-config
                  key: CORS_ORIGIN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: storm-secret
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: storm-secret
                  key: JWT_REFRESH_SECRET
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: storm-secret
                  key: POSTGRES_DSN
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: storm-secret
                  key: REDIS_ADDR
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp-dir
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: storm
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: pprof
      port: 6060
      targetPort: 6060
